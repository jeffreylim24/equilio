services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: equilio
      POSTGRES_PASSWORD: equilio # local dev only
      POSTGRES_DB: equilio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equilio -d equilio"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
